services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_edu
      POSTGRES_PASSWORD: family_edu
      POSTGRES_DB: family_edu
    volumes:
      - family_edu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_edu"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://family_edu:family_edu@db:5432/family_edu
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      INVITE_CODES: ${INVITE_CODES:-HE-2026,JOJO-2026}
      MCP_TOKEN: ${MCP_TOKEN:-family-edu-2026}
      MCP_FAMILY_ID: ${MCP_FAMILY_ID:-family_001}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_QR_ENV_VERSION: ${WECHAT_QR_ENV_VERSION:-release}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4100}
      WORKBUDDY_SOURCE: ${WORKBUDDY_SOURCE:-heyah-family-education}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-family-edu-files}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      # 内置学习私教（Education Agent Layer）
      # 注意：这个文件是显式列举环境变量的，不写在这里的变量不会进容器，
      # 光改 .env 不生效（曾因此让 TUTOR_ENABLED=true 无效、接口一直 503）。
      TUTOR_ENABLED: ${TUTOR_ENABLED:-false}
      TUTOR_CHAT_BASE_URL: ${TUTOR_CHAT_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      TUTOR_CHAT_API_KEY: ${TUTOR_CHAT_API_KEY:-}
      TUTOR_CHAT_MODEL: ${TUTOR_CHAT_MODEL:-}
      TUTOR_VISION_MODEL: ${TUTOR_VISION_MODEL:-}
      TUTOR_MAX_TOOL_ROUNDS: ${TUTOR_MAX_TOOL_ROUNDS:-6}
      TUTOR_REQUEST_TIMEOUT_MS: ${TUTOR_REQUEST_TIMEOUT_MS:-45000}
      TUTOR_TOOL_RESULT_LIMIT: ${TUTOR_TOOL_RESULT_LIMIT:-6000}
      TUTOR_CONTEXT_WINDOW_TURNS: ${TUTOR_CONTEXT_WINDOW_TURNS:-12}
      TUTOR_DAILY_MESSAGE_LIMIT: ${TUTOR_DAILY_MESSAGE_LIMIT:-60}
      TUTOR_DAILY_TOKEN_LIMIT: ${TUTOR_DAILY_TOKEN_LIMIT:-0}
      TUTOR_MODERATION_ENABLED: ${TUTOR_MODERATION_ENABLED:-true}
      TUTOR_ASR_APP_ID: ${TUTOR_ASR_APP_ID:-}
      TUTOR_ASR_ACCESS_TOKEN: ${TUTOR_ASR_ACCESS_TOKEN:-}
      TUTOR_ASR_CLUSTER: ${TUTOR_ASR_CLUSTER:-}
      TUTOR_TTS_APP_ID: ${TUTOR_TTS_APP_ID:-}
      TUTOR_TTS_ACCESS_TOKEN: ${TUTOR_TTS_ACCESS_TOKEN:-}
      TUTOR_TTS_CLUSTER: ${TUTOR_TTS_CLUSTER:-}
      TUTOR_TTS_VOICE_TYPE: ${TUTOR_TTS_VOICE_TYPE:-}
      PORT: 4100
      WEB_DIST: /app/public
    ports:
      - "127.0.0.1:4100:4100"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - family_edu_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  family_edu_pgdata:
  family_edu_minio:
