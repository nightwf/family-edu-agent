services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_edu
      POSTGRES_PASSWORD: family_edu
      POSTGRES_DB: family_edu
    volumes:
      - family_edu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_edu"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://family_edu:family_edu@db:5432/family_edu
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      INVITE_CODES: ${INVITE_CODES:-HE-2026,JOJO-2026}
      MCP_TOKEN: ${MCP_TOKEN:-family-edu-2026}
      MCP_FAMILY_ID: ${MCP_FAMILY_ID:-family_001}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-family-edu-files}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      PORT: 4100
      WEB_DIST: /app/public
    ports:
      - "127.0.0.1:4100:4100"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - family_edu_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  family_edu_pgdata:
  family_edu_minio:
