<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禾芽小程序登录页</title>
<style>
html,body{margin:0;background:#eceadf;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
button,input{font-family:inherit}
.wrap{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start;padding:40px 16px 56px}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.cap{color:#6c7a7d;font-size:13px}
#frame,.frame2{width:375px;height:812px;overflow:hidden;background:#f7f1df;position:relative;border-radius:34px;box-shadow:0 26px 60px rgba(20,50,55,.2)}
.login-page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: #f7f1df;
}

/* 顶部品牌区，与导航栏同色，连成一条完整的色带 */
.hero {
  position: relative;
  height: 200.00px;
  flex-shrink: 0;
  border-bottom-left-radius: 30.00px;
  border-bottom-right-radius: 30.00px;
  background-color: #0f766e;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='230'%20height='200'%20viewBox='0%200%20230%20200'%20fill='none'%3E%3Cpath%20d='M4%20168C60%20150%2096%2096%20132%2060%20156%2036%20186%2022%20214%2016'%20stroke='%23ffffff'%20stroke-opacity='0.18'%20stroke-width='2.5'%20stroke-linecap='round'/%3E%3Cpath%20d='M132%2060c8-18%2026-28%2044-26-2%2018-18%2030-44%2026Z'%20fill='%23ffffff'%20fill-opacity='0.18'/%3E%3Cpath%20d='M74%20116c4-16%2020-24%2036-22-2%2016-16%2026-36%2022Z'%20fill='%23ffffff'%20fill-opacity='0.12'/%3E%3Ccircle%20cx='214'%20cy='16'%20r='5'%20fill='%23ffffff'%20fill-opacity='0.18'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right -14.00px bottom -20.00px;
  background-size: 230.00px 200.00px;
}

.hero-inner {
  display: flex;
  align-items: center;
  padding: 26.00px 30.00px 0;
}

.mark {
  position: relative;
  width: 62.00px;
  height: 62.00px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20.00px;
  background: #f3c969;
  color: #23433f;
  font-size: 32.00px;
  font-weight: 800;
  box-shadow: 0 8.00px 16.00px rgba(0, 0, 0, 0.16);
}

.leaf {
  position: absolute;
  top: 9.00px;
  right: 10.00px;
  width: 10.00px;
  height: 10.00px;
  border-radius: 8.00px 1.00px 8.00px 1.00px;
  background: #0f766e;
  transform: rotate(-24deg);
}

.brand { margin-left: 16.00px; min-width: 0; }
.brand-name { color: #ffffff; font-size: 21.00px; font-weight: 700; }
.brand-sub { margin-top: 6.00px; color: rgba(255, 255, 255, 0.72); font-size: 12.50px; }

/* 登录面板，向上压住色带边缘 */
.sheet {
  position: relative;
  margin: -36.00px 20.00px 0;
  padding: 26.00px 22.00px 24.00px;
  border: 0.50px solid #ece2cb;
  border-radius: 22.00px;
  background: #fffdf7;
  box-shadow: 0 12.00px 30.00px rgba(23, 62, 62, 0.13);
}

.sheet-title {
  margin-bottom: 18.00px;
  color: #17464b;
  font-size: 18.00px;
  font-weight: 700;
}

.wechat-btn {
  width: 100%;
  height: 54.00px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10.00px;
  border: none;
  border-radius: 16.00px;
  background: #18ad63;
  color: #ffffff;
  font-size: 16.50px;
  font-weight: 600;
  line-height: 54.00px;
  box-shadow: 0 9.00px 20.00px rgba(24, 173, 99, 0.26);
}

.wechat-btn::after { border: none; }

.wechat-mark {
  width: 24.00px;
  height: 24.00px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.50px solid rgba(255, 255, 255, 0.95);
  border-radius: 50%;
  font-size: 12.00px;
  font-weight: 700;
  line-height: 1;
}

.divider {
  display: flex;
  align-items: center;
  margin-top: 22.00px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 0.50px;
  background: #ece2cb;
}

.divider-text {
  padding: 0 12.00px;
  color: #a8b1b0;
  font-size: 11.50px;
}

.link-center {
  margin-top: 16.00px;
  color: #4f6b6d;
  font-size: 13.50px;
  font-weight: 600;
  text-align: center;
}

.field { margin-bottom: 16.00px; }
.field-label { margin-bottom: 8.00px; color: #6d7c7e; font-size: 12.50px; font-weight: 600; }

.field-input {
  width: 100%;
  height: 48.00px;
  padding: 0 14.00px;
  border: 0.50px solid #e6dcc5;
  border-radius: 13.00px;
  background: #ffffff;
  color: #203238;
  font-size: 15.00px;
  box-sizing: border-box;
}

.field-placeholder { color: #b4bdbe; }

.submit-btn {
  width: 100%;
  height: 50.00px;
  margin-top: 6.00px;
  border: none;
  border-radius: 15.00px;
  background: #0f766e;
  color: #ffffff;
  font-size: 16.00px;
  font-weight: 600;
  line-height: 50.00px;
}

.submit-btn::after { border: none; }

.alert {
  margin-top: 14.00px;
  padding: 12.00px 13.00px;
  border: 0.50px solid #f0c7bc;
  border-radius: 12.00px;
  background: #fff5f1;
}

.alert-title { color: #9f3e2d; font-size: 13.50px; font-weight: 700; line-height: 1.4; }
.alert-detail { margin-top: 4.00px; color: #b25b49; font-size: 12.00px; line-height: 1.55; word-break: break-word; }
.alert-action { margin-top: 9.00px; color: #0f766e; font-size: 12.50px; font-weight: 700; }

.footer {
  margin-top: auto;
  padding: 24.00px 20.00px calc(30.00px + env(safe-area-inset-bottom));
  color: #97a0a0;
  font-size: 11.50px;
  text-align: center;
}

</style></head>
<body>
<div class="wrap">
  <div class="col"><div class="cap">微信登录 · 默认状态</div><div id="frame">
<div class="login-page">
  <div class="hero">
    <div class="hero-inner">
      <div class="mark">禾<div class="leaf"></div></div>
      <div class="brand">
        <div class="brand-name">禾芽家庭教务</div>
        <div class="brand-sub">孩子的成长，值得被看见</div>
      </div>
    </div>
  </div>
  <div class="sheet">
    <button class="wechat-btn"><div class="wechat-mark">微</div><span>微信登录</span></button>
    <div class="divider"><span class="divider-text">其他方式</span></div>
    <div class="link-center">邮箱登录</div>
  </div>
  <div class="footer">家庭数据仅当前家庭的管理者可见</div>
</div>
</div></div>
  <div class="col"><div class="cap">邮箱登录 · 展开状态</div><div class="frame2">
<div class="login-page">
  <div class="hero">
    <div class="hero-inner">
      <div class="mark">禾<div class="leaf"></div></div>
      <div class="brand">
        <div class="brand-name">禾芽家庭教务</div>
        <div class="brand-sub">孩子的成长，值得被看见</div>
      </div>
    </div>
  </div>
  <div class="sheet">
    <div class="sheet-title">邮箱登录</div>
    <div class="field">
      <div class="field-label">邮箱</div>
      <input class="field-input" type="text" placeholder="请输入邮箱">
    </div>
    <div class="field">
      <div class="field-label">密码</div>
      <input class="field-input" type="password" placeholder="请输入密码">
    </div>
    <button class="submit-btn">登录</button>
    <div class="link-center">返回微信登录</div>
  </div>
  <div class="footer">家庭数据仅当前家庭的管理者可见</div>
</div>
</div></div>
</div>
</body></html>
