# heyaagent.top 站点配置（服务器路径 /etc/nginx/sites-available/heyaagent-ssl.conf）
# 说明：
#   location /             -> 根路径直接访问网站，App 内部按 /api 调用，故需代理到 API
#   location /family-edu/  -> 保留给小程序与 WorkBuddy 的旧路径，不能删除
#   修改后需执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name heyaagent.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name heyaagent.top;

    ssl_certificate /etc/letsencrypt/live/heyaagent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heyaagent.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 65s;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    location = /family-edu/mcp {
        proxy_pass http://127.0.0.1:4100/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /family-edu/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 根路径直接访问网站，与 /family-edu/ 使用同一份应用
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
